services:
  postgres:
    image: postgres:16-alpine
    container_name: checkout-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: checkout_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkout_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: checkout-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/checkout_db
      DB_SSL: "false"
      WOMPI_ENV: sandbox
      WOMPI_API_KEY: prv_stagtest_your_key_here
      WOMPI_BASE_URL: https://api-sandbox.co.uat.wompi.dev/v1
    volumes:
      - ./apps/backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: checkout-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:4173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules

volumes:
  pgdata:
