# openspec/config.yaml
# Project-specific SDD configuration for Checkout Challenge
# Auto-generated by sdd-init phase.

schema: spec-driven

strict_tdd: true

context: |
  Full-stack Wompi checkout: React 19/Vite/TS + Redux Toolkit frontend; NestJS 12/TS/PostgreSQL backend
  Hexagonal architecture; Wompi sandbox payment adapter; Docker Compose dev stack
  Testing: Vitest (unit + e2e) with React Testing Library + supertest; 80% coverage threshold
  Style: vanilla CSS, mobile-first, a11y focus, no Tailwind

testing:
  backend:
    runner: vitest
    unit_command: "npm run test"
    coverage_command: "npm run test:cov"
    e2e_command: "npm run test:e2e"
    coverage_tool: "@vitest/coverage-v8"
    coverage_threshold: 80
  frontend:
    runner: vitest
    unit_command: "npx vitest run"
    coverage_command: "n/a"
    coverage_tool: "not configured"
  lint: oxlint
  typecheck: tsc
  format: prettier (backend only)

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference existing change: payment-checkout
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    patterns:
      - Follow existing code patterns
    tdd: true
    test_command: "npm run test"
  verify:
    test_command: "npm run test"
    build_command: "npm run build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
    - Preserve archived change folders as audit trail
